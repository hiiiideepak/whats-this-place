services:
  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: around
      POSTGRES_PASSWORD: around
      POSTGRES_DB: around
    ports:
      - '5433:5432'
    volumes:
      - around_pg:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-postgis.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U around -d around']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  around_pg:
